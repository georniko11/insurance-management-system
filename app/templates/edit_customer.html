{% extends "base.html" %}

{% block content %}

<h2 class="fw-bold mb-4">Επεξεργασία Πελάτη</h2>

<div class="card shadow-sm border-0 p-4">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="mb-3">
            <label class="form-label">Όνομα *</label>
            <input
                type="text"
                name="first_name"
                class="form-control"
                value="{{ customer['first_name'] }}"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Επώνυμο *</label>
            <input
                type="text"
                name="last_name"
                class="form-control"
                value="{{ customer['last_name'] }}"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">ΑΦΜ</label>
            <input
                type="text"
                name="afm"
                class="form-control"
                value="{{ customer['afm'] or '' }}"
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Διεύθυνση</label>
            <input
                type="text"
                name="address"
                class="form-control"
                value="{{ customer['address'] or '' }}"
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Σημειώσεις</label>
            <textarea
                name="notes"
                class="form-control"
                rows="3"
            >{{ customer['notes'] or '' }}</textarea>
        </div>

        <button type="submit" class="btn btn-primary">
            Αποθήκευση Αλλαγών
        </button>

    </form>
</div>

{% endblock %}
